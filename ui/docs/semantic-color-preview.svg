<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="900" viewBox="0 0 1480 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10" />
    </filter>
    <style>
      text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-size: 28px; font-weight: 700; fill: #172033; }
      .subtitle { font-size: 14px; fill: #64748b; }
      .frame-title { font-size: 18px; font-weight: 700; }
      .meta { font-size: 12px; }
      .row-title { font-size: 15px; font-weight: 700; }
      .sample { font-size: 13px; font-weight: 600; }
      .button-text { font-size: 12px; font-weight: 700; }
      .sidebar-brand { font-size: 16px; font-weight: 700; fill: #ffffff; }
      .sidebar-text { font-size: 12px; fill: rgba(255,255,255,0.82); }
    </style>
  </defs>

  <rect width="1480" height="900" fill="#eef2f6" />
  <text x="40" y="46" class="title">SealDice 四种语义色 · 主页面深浅主题效果</text>
  <text x="40" y="72" class="subtitle">同一语义在浅色主题中保持约 4.5:1 白底对比；暗色主题整体提高明度，并同步展示浅底状态与实心控件。</text>

  <!-- Light application shell -->
  <g filter="url(#shadow)">
    <rect x="40" y="100" width="680" height="750" rx="12" fill="#f4f6f9" />
    <path d="M52 100h128v750H52c-6.6 0-12-5.4-12-12V112c0-6.6 5.4-12 12-12z" fill="#243247" />
  </g>
  <text x="62" y="139" class="sidebar-brand">SealDice</text>
  <text x="62" y="163" class="sidebar-text">浅色主题侧边栏</text>
  <rect x="54" y="194" width="112" height="36" rx="6" fill="#ffffff" opacity="0.07" />
  <rect x="54" y="240" width="112" height="36" rx="6" fill="#3069e5" opacity="0.30" />
  <rect x="62" y="206" width="68" height="7" rx="3.5" fill="#ffffff" opacity="0.62" />
  <rect x="62" y="252" width="78" height="7" rx="3.5" fill="#ffffff" opacity="0.92" />
  <rect x="62" y="298" width="58" height="7" rx="3.5" fill="#ffffff" opacity="0.42" />
  <text x="208" y="138" class="frame-title" fill="#172033">浅色主页面</text>
  <text x="208" y="160" class="meta" fill="#64748b">页面 #F4F6F9 · 内容面 #FFFFFF · 侧边栏 #243247</text>
  <rect x="204" y="184" width="488" height="626" rx="10" fill="#ffffff" stroke="#d9e0e9" />
  <text x="230" y="220" font-size="16" font-weight="700" fill="#172033">语义状态示例</text>
  <text x="230" y="242" class="meta" fill="#8490a3">文字、图标、浅底状态和实心控件使用同一基础色</text>

  <!-- Light primary -->
  <line x1="230" y1="365" x2="666" y2="365" stroke="#e6ebf1" />
  <circle cx="246" cy="295" r="8" fill="#3069e5" />
  <path d="M242 295l3 3 6-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="266" y="291" class="row-title" fill="#172033">主题 Primary</text>
  <text x="266" y="312" class="meta" fill="#64748b">#3069E5</text>
  <text x="386" y="300" class="sample" fill="#3069e5">状态文本</text>
  <rect x="472" y="278" width="86" height="34" rx="6" fill="#ecf2fd" />
  <text x="515" y="300" text-anchor="middle" class="sample" fill="#3069e5">浅底状态</text>
  <rect x="572" y="278" width="92" height="34" rx="6" fill="#3069e5" />
  <text x="618" y="300" text-anchor="middle" class="button-text" fill="#ffffff">主要操作</text>

  <!-- Light success -->
  <line x1="230" y1="476" x2="666" y2="476" stroke="#e6ebf1" />
  <circle cx="246" cy="406" r="8" fill="#218755" />
  <path d="M242 406l3 3 6-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="266" y="402" class="row-title" fill="#172033">成功 Success</text>
  <text x="266" y="423" class="meta" fill="#64748b">#218755</text>
  <text x="386" y="411" class="sample" fill="#218755">运行正常</text>
  <rect x="472" y="389" width="86" height="34" rx="6" fill="#ebf4f0" />
  <text x="515" y="411" text-anchor="middle" class="sample" fill="#218755">已完成</text>
  <rect x="572" y="389" width="92" height="34" rx="6" fill="#218755" />
  <text x="618" y="411" text-anchor="middle" class="button-text" fill="#ffffff">确认成功</text>

  <!-- Light warning -->
  <line x1="230" y1="587" x2="666" y2="587" stroke="#e6ebf1" />
  <circle cx="246" cy="517" r="8" fill="#a26b0c" />
  <path d="M246 511v7m0 4h.1" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" />
  <text x="266" y="513" class="row-title" fill="#172033">警告 Warning</text>
  <text x="266" y="534" class="meta" fill="#64748b">#A26B0C</text>
  <text x="386" y="522" class="sample" fill="#a26b0c">需要注意</text>
  <rect x="472" y="500" width="86" height="34" rx="6" fill="#f6f0e7" />
  <text x="515" y="522" text-anchor="middle" class="sample" fill="#a26b0c">待处理</text>
  <rect x="572" y="500" width="92" height="34" rx="6" fill="#a26b0c" />
  <text x="618" y="522" text-anchor="middle" class="button-text" fill="#ffffff">继续操作</text>

  <!-- Light error -->
  <circle cx="246" cy="628" r="8" fill="#dd2929" />
  <path d="M242 624l8 8m0-8l-8 8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" />
  <text x="266" y="624" class="row-title" fill="#172033">错误 Error</text>
  <text x="266" y="645" class="meta" fill="#64748b">#DD2929</text>
  <text x="386" y="633" class="sample" fill="#dd2929">操作失败</text>
  <rect x="472" y="611" width="86" height="34" rx="6" fill="#fceaea" />
  <text x="515" y="633" text-anchor="middle" class="sample" fill="#dd2929">有错误</text>
  <rect x="572" y="611" width="92" height="34" rx="6" fill="#dd2929" />
  <text x="618" y="633" text-anchor="middle" class="button-text" fill="#ffffff">删除确认</text>

  <rect x="230" y="700" width="436" height="78" rx="8" fill="#f7f9fb" />
  <text x="250" y="730" class="sample" fill="#526078">浅色主题观感</text>
  <text x="250" y="754" class="meta" fill="#64748b">四色统一在接近的明度区间，保留状态区分但不显得沉重。</text>

  <!-- Dark application shell -->
  <g filter="url(#shadow)">
    <rect x="760" y="100" width="680" height="750" rx="12" fill="#0f1522" />
    <path d="M772 100h128v750H772c-6.6 0-12-5.4-12-12V112c0-6.6 5.4-12 12-12z" fill="#090e18" />
  </g>
  <text x="782" y="139" class="sidebar-brand">SealDice</text>
  <text x="782" y="163" class="sidebar-text">深色主题侧边栏</text>
  <rect x="774" y="194" width="112" height="36" rx="6" fill="#ffffff" opacity="0.07" />
  <rect x="774" y="240" width="112" height="36" rx="6" fill="#6791f1" opacity="0.30" />
  <rect x="782" y="206" width="68" height="7" rx="3.5" fill="#ffffff" opacity="0.66" />
  <rect x="782" y="252" width="78" height="7" rx="3.5" fill="#ffffff" opacity="0.94" />
  <rect x="782" y="298" width="58" height="7" rx="3.5" fill="#ffffff" opacity="0.46" />
  <text x="928" y="138" class="frame-title" fill="#f8fafc">深色主页面</text>
  <text x="928" y="160" class="meta" fill="#94a3b8">页面 #0F1522 · 内容面 #151D2B · 侧边栏 #090E18</text>
  <rect x="924" y="184" width="488" height="626" rx="10" fill="#151d2b" stroke="#334155" />
  <text x="950" y="220" font-size="16" font-weight="700" fill="#f8fafc">语义状态示例</text>
  <text x="950" y="242" class="meta" fill="#94a3b8">暗色主题使用更高明度，避免语义色发灰和下沉</text>

  <!-- Dark primary -->
  <line x1="950" y1="365" x2="1386" y2="365" stroke="#334155" opacity="0.65" />
  <circle cx="966" cy="295" r="8" fill="#6791f1" />
  <path d="M962 295l3 3 6-7" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="986" y="291" class="row-title" fill="#f8fafc">主题 Primary</text>
  <text x="986" y="312" class="meta" fill="#94a3b8">#6791F1</text>
  <text x="1106" y="300" class="sample" fill="#6791f1">状态文本</text>
  <rect x="1192" y="278" width="86" height="34" rx="6" fill="#22304b" />
  <text x="1235" y="300" text-anchor="middle" class="sample" fill="#6791f1">浅底状态</text>
  <rect x="1292" y="278" width="92" height="34" rx="6" fill="#6791f1" />
  <text x="1338" y="300" text-anchor="middle" class="button-text" fill="#111827">主要操作</text>

  <!-- Dark success -->
  <line x1="950" y1="476" x2="1386" y2="476" stroke="#334155" opacity="0.65" />
  <circle cx="966" cy="406" r="8" fill="#4cac73" />
  <path d="M962 406l3 3 6-7" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="986" y="402" class="row-title" fill="#f8fafc">成功 Success</text>
  <text x="986" y="423" class="meta" fill="#94a3b8">#4CAC73</text>
  <text x="1106" y="411" class="sample" fill="#4cac73">运行正常</text>
  <rect x="1192" y="389" width="86" height="34" rx="6" fill="#1d3135" />
  <text x="1235" y="411" text-anchor="middle" class="sample" fill="#4cac73">已完成</text>
  <rect x="1292" y="389" width="92" height="34" rx="6" fill="#4cac73" />
  <text x="1338" y="411" text-anchor="middle" class="button-text" fill="#111827">确认成功</text>

  <!-- Dark warning -->
  <line x1="950" y1="587" x2="1386" y2="587" stroke="#334155" opacity="0.65" />
  <circle cx="966" cy="517" r="8" fill="#ca9438" />
  <path d="M966 511v7m0 4h.1" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" />
  <text x="986" y="513" class="row-title" fill="#f8fafc">警告 Warning</text>
  <text x="986" y="534" class="meta" fill="#94a3b8">#CA9438</text>
  <text x="1106" y="522" class="sample" fill="#ca9438">需要注意</text>
  <rect x="1192" y="500" width="86" height="34" rx="6" fill="#2e2e2d" />
  <text x="1235" y="522" text-anchor="middle" class="sample" fill="#ca9438">待处理</text>
  <rect x="1292" y="500" width="92" height="34" rx="6" fill="#ca9438" />
  <text x="1338" y="522" text-anchor="middle" class="button-text" fill="#111827">继续操作</text>

  <!-- Dark error -->
  <circle cx="966" cy="628" r="8" fill="#ea6666" />
  <path d="M962 624l8 8m0-8l-8 8" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" />
  <text x="986" y="624" class="row-title" fill="#f8fafc">错误 Error</text>
  <text x="986" y="645" class="meta" fill="#94a3b8">#EA6666</text>
  <text x="1106" y="633" class="sample" fill="#ea6666">操作失败</text>
  <rect x="1192" y="611" width="86" height="34" rx="6" fill="#332733" />
  <text x="1235" y="633" text-anchor="middle" class="sample" fill="#ea6666">有错误</text>
  <rect x="1292" y="611" width="92" height="34" rx="6" fill="#ea6666" />
  <text x="1338" y="633" text-anchor="middle" class="button-text" fill="#111827">删除确认</text>

  <rect x="950" y="700" width="436" height="78" rx="8" fill="#1c2636" />
  <text x="970" y="730" class="sample" fill="#cbd5e1">深色主题观感</text>
  <text x="970" y="754" class="meta" fill="#94a3b8">四色整体提亮，仍保持克制，不使用荧光式高饱和状态色。</text>

  <text x="40" y="882" class="meta" fill="#64748b">预览基于当前主题 token：页面、内容面、soft 状态底色、侧边栏与四种语义色。</text>
</svg>
