name: Test & Lint

on:
  push:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.toml'
      - '.github/workflows/test-and-lint.yml'
      - '.github/scripts/lint.sh'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.toml'
      - '.github/workflows/test-and-lint.yml'
      - '.github/scripts/lint.sh'

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Test & Lint
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    steps:
      - name: Code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - run: go mod download
      - run: go generate ./...

      - run: go test -v -race ./...
      - run: go vet ./...

      - name: Install GolangCI-Lint
        uses: golangci/golangci-lint-action@v9
        if: github.event_name != 'pull_request'
        with:
          version: v2.15.0
          install-only: true
      - name: Verify configuration and lint
        if: github.event_name != 'pull_request'
        run: bash .github/scripts/lint.sh
