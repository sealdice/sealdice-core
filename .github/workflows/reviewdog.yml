name: Review Dog

on:
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.toml'
      - '.github/workflows/reviewdog.yml'
      - '.github/scripts/lint.sh'

permissions:
  contents: read

jobs:
  review-dog:
    name: Review Dog
    runs-on: ubuntu-24.04
    steps:
      - name: Code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - run: go mod download
      - run: go generate ./...
      - name: Install GolangCI-Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
      - name: Verify configuration and lint
        run: bash .github/scripts/lint.sh
