<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>豹包目录</title>
  <meta name="color-scheme" content="light">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <main class="shell">
    <section class="masthead">
      <div>
        <p class="eyebrow">SealPack 资源浏览系统</p>
        <h1>豹包目录</h1>
        <p class="lead">官方源直连浏览、分类筛选、详情预览、sealpack 下载。</p>
      </div>
      <div class="status-card">
        <div class="status-row">
          <span class="label">源地址</span>
          <code id="baseLabel">https://repo.sealdice.com/dice/api/store</code>
        </div>
        <div class="status-row">
          <span class="label">后端状态</span>
          <strong id="backendStatus">未连接</strong>
        </div>
        <div class="status-row">
          <span class="label">当前分类</span>
          <strong id="activeCategory">全部</strong>
        </div>
      </div>
    </section>

    <section class="toolbar">
      <label>
        接口地址
        <input id="apiBase" type="url" value="https://repo.sealdice.com/dice/api/store" spellcheck="false">
      </label>
      <label>
        搜索
        <input id="searchInput" type="search" placeholder="搜名字、作者、简介、关键字">
      </label>
      <label>
        排序
        <select id="sortSelect">
          <option value="updateTime-desc">更新时间降序</option>
          <option value="downloadCount-desc">下载量降序</option>
          <option value="releaseTime-desc">发布时间降序</option>
          <option value="name-asc">名称升序</option>
        </select>
      </label>
      <button id="refreshBtn" class="secondary">刷新</button>
    </section>

    <section class="content-grid">
      <aside class="sidebar">
        <article>
          <h2>内容分类</h2>
          <div id="contentFilters" class="filter-list"></div>
        </article>
        <article>
          <h2>商店分类</h2>
          <div id="storeCategories" class="chip-list"></div>
        </article>
        <article>
          <h2>说明</h2>
          <p class="muted">如果官方源被浏览器拦截跨域，这个纯前端页就需要放到同源环境或加代理。</p>
        </article>
      </aside>

      <section class="list-panel">
        <div class="list-head">
          <h2 id="resultTitle">全部豹包</h2>
          <span id="resultCount" class="muted">0 项</span>
        </div>
        <div id="packageList" class="package-list"></div>
        <nav class="pager">
          <button id="prevPage" class="secondary">上一页</button>
          <span id="pageInfo">第 1 页</span>
          <button id="nextPage" class="secondary">下一页</button>
        </nav>
      </section>

      <aside id="detailPanel" class="detail-panel">
        <article>
          <div class="detail-empty" id="detailEmpty">点一项看详情</div>
          <div id="detailBody" class="hidden">
            <p class="eyebrow" id="detailCategory"></p>
            <h2 id="detailName"></h2>
            <p id="detailDesc" class="detail-desc"></p>
            <div class="meta-grid">
              <div><span>作者</span><strong id="detailAuthors"></strong></div>
              <div><span>版本</span><strong id="detailVersion"></strong></div>
              <div><span>内容</span><strong id="detailContents"></strong></div>
              <div><span>下载</span><strong id="detailDownloads"></strong></div>
            </div>
            <div class="action-row">
              <a id="downloadSealpack" role="button">下载 sealpack</a>
              <a id="downloadZip" role="button" class="secondary">下载 zip</a>
              <button id="copyLinkBtn" class="secondary">复制直链</button>
            </div>
            <details open>
              <summary>包信息</summary>
              <pre id="detailJson"></pre>
            </details>
          </div>
        </article>
      </aside>
    </section>
  </main>

  <template id="packageItemTpl">
    <article class="pkg-item">
      <div class="pkg-top">
        <div>
          <h3 class="pkg-name"></h3>
          <p class="pkg-desc"></p>
        </div>
        <span class="pkg-version"></span>
      </div>
      <div class="pkg-badges"></div>
      <div class="pkg-footer">
        <span class="pkg-author"></span>
        <div class="pkg-actions">
          <button class="open-btn">查看</button>
          <a class="download-btn" role="button">下载</a>
        </div>
      </div>
    </article>
  </template>

  <template id="chipTpl">
    <button class="chip" type="button"></button>
  </template>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
